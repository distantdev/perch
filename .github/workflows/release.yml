name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            name: linux-x86_64
            ext: tar.gz
            bin: perch
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            name: windows-x86_64
            ext: zip
            bin: perch.exe
          - os: macos-latest
            target: aarch64-apple-darwin
            name: macos-aarch64
            ext: tar.gz
            bin: perch

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package (Unix)
        if: runner.os != 'Windows'
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          src="target/${{ matrix.target }}/release/${{ matrix.bin }}"
          pkg="perch-${TAG}-${{ matrix.name }}"
          mkdir -p "dist/${pkg}"
          cp "${src}" "dist/${pkg}/${{ matrix.bin }}"
          tar -C dist -czf "dist/${pkg}.tar.gz" "${pkg}"
          echo "ARCHIVE=dist/${pkg}.tar.gz" >> "${GITHUB_ENV}"

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          TAG: ${{ github.ref_name }}
        run: |
          $ErrorActionPreference = "Stop"
          $src = "target/${{ matrix.target }}/release/${{ matrix.bin }}"
          $pkg = "perch-$env:TAG-${{ matrix.name }}"
          $dir = "dist/$pkg"
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          Copy-Item $src "$dir/${{ matrix.bin }}"
          $archive = "dist/$pkg.zip"
          Compress-Archive -Path $dir -DestinationPath $archive -Force
          "ARCHIVE=$archive" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - uses: actions/upload-artifact@v4
        with:
          name: perch-${{ matrix.name }}
          path: ${{ env.ARCHIVE }}

  release:
    name: publish
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: perch-*
          merge-multiple: true
          path: dist

      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/*
